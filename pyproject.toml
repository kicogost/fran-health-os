[project]
name = "health-os"
version = "0.1.0"
description = "Personal, local-first health data warehouse and coaching layer for Francisco."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - personal use only" }

dependencies = [
    # Config / env
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # DB
    # sqlite3 is stdlib; no driver dependency needed.
    # Garmin (unofficial client). >=0.3.11 for the `typed` extra: validated
    # Pydantic response models for the live-sync endpoints (ingest/garmin.py) —
    # see docs/decisions/0004-garmin-live-sync-typed-responses.md for why we
    # lean on this over hand-parsing raw dicts. pydantic itself was already an
    # installed transitive dep (via garth/stravalib); this just makes the
    # dependency direct and explicit now that we import it ourselves.
    "garminconnect[typed]>=0.3.11",
    "garth>=0.4.44",
    "pydantic>=2.0",
    # FIT file parsing
    "fitdecode>=0.10.0",
    # Apple Health export parsing
    "lxml>=5.2",
    # Strava
    "stravalib>=2.0",
    # Data / metrics
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    # Dashboard
    "streamlit>=1.36",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_os"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
