[project]
name = "health-os"
version = "0.1.0"
description = "Personal, local-first health data warehouse and coaching layer for Francisco."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - personal use only" }

dependencies = [
    # Config / env
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # DB
    # sqlite3 is stdlib; no driver dependency needed.
    # Garmin (unofficial client)
    "garminconnect>=0.2.20",
    "garth>=0.4.44",
    # FIT file parsing
    "fitdecode>=0.10.0",
    # Apple Health export parsing
    "lxml>=5.2",
    # Strava
    "stravalib>=2.0",
    # Data / metrics
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    # Dashboard
    "streamlit>=1.36",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_os"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
